<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile preview — rumbimunyaradzi.com</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#20302f;font-family:'Instrument Sans',system-ui,sans-serif;color:#faf7f2;padding:28px}
  h1{font-size:19px;font-weight:700;margin:0 0 4px}
  p{margin:0 0 22px;font-size:13.5px;color:#a9b3b1}
  .row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .phone{width:410px;flex:0 0 auto}
  .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#f0a58c;font-weight:700;margin-bottom:10px}
  .bezel{width:410px;height:780px;border:10px solid #0d1716;border-radius:38px;overflow:hidden;background:#faf7f2;box-shadow:0 20px 50px rgba(0,0,0,.45)}
  iframe{width:390px;height:760px;border:0;display:block}
</style>
</head>
<body>
<h1>Mobile preview — 390 × 760 (iPhone-class)</h1>
<p>Each frame is the live site at phone width. Scroll inside a frame to check a section.</p>
<div class="row">
  <div class="phone">
    <div class="label">Home</div>
    <div class="bezel"><iframe src="index.html" title="Home"></iframe></div>
  </div>
  <div class="phone">
    <div class="label">Community &amp; pricing</div>
    <div class="bezel"><iframe src="community/index.html" title="Community"></iframe></div>
  </div>
  <div class="phone">
    <div class="label">About</div>
    <div class="bezel"><iframe src="about/index.html" title="About"></iframe></div>
  </div>
</div>
</body>
</html>
